<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Brainic — Mind Games</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 0%, #241f45 0%, #12102a 60%, #0b0a1c 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #f4f2ff;
    padding: 24px;
  }
  .card {
    max-width: 420px;
    width: 100%;
    text-align: center;
  }
  h1 {
    font-size: 34px;
    margin: 0 0 8px;
    letter-spacing: 0.5px;
    text-shadow: 0 2px 8px rgba(109,90,214,0.7);
  }
  h1 span { color: #F0A73B; }
  p.tagline {
    color: #b9b6d9;
    margin: 0 0 32px;
    font-size: 15px;
  }
  .links {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  a.link {
    display: block;
    padding: 14px 20px;
    border-radius: 14px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    color: #f4f2ff;
    text-decoration: none;
    font-size: 15px;
    font-weight: 600;
    transition: background 0.15s ease;
  }
  a.link:hover { background: rgba(255,255,255,0.12); }
  footer {
    margin-top: 40px;
    font-size: 12px;
    color: #6f6c8f;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>BRAIN<span>IC</span></h1>
    <p class="tagline">A calm hub of mini brain games — 2048, Sudoku, Dots &amp; Boxes, Battleship and more.</p>
    <div class="links">
      <a class="link" href="https://play.google.com/store/apps/details?id=com.brainic.mindgames">Get it on Google Play</a>
      <a class="link" href="https://sb-studioz.github.io/brainic-privacy-policy/">Privacy Policy</a>
      <a class="link" href="mailto:team.sb.studioz@gmail.com">Contact / Support</a>
    </div>
    <footer>&copy; SB Studios</footer>
  </div>
</body>
</html>
